# Site statique de la version web. L'API (/api) est routée vers le backend par
# Traefik : nginx ne la voit jamais.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Les fichiers Flutter ne changent pas de nom d'une version à l'autre :
    # le navigateur revérifie toujours (ETag), une mise à jour arrive aussitôt.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # Rien d'autre que ce site ne s'exécute sur la page qui détient la session :
    # Flutter (canvaskit servi ici, --no-web-resources-cdn) et SQLite wasm
    # exigent 'wasm-unsafe-eval' ; les polices de secours (arabe…) viennent de
    # fonts.gstatic.com.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    server_tokens off;

    # Le gros JS et le wasm de Flutter partent compressés (iPhone en 4G).
    gzip on;
    gzip_types application/javascript text/javascript application/wasm application/json text/css;

    # Un fichier de l'app absent = vraie 404 (pas index.html, qui masquerait
    # un sqlite3.wasm manquant derrière une erreur incompréhensible).
    location ~ \.(js|wasm|json|png|ttf|otf|bin|frag)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
