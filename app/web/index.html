<!DOCTYPE html>
<html lang="fr">
<head>
  <!-- Remplacé par `--base-href` au build (site servi à la racine : "/"). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Gestion magasin — vente, stock, dépôt.">
  <meta name="theme-color" content="#0B1017">

  <!-- iPhone : « Partager → Sur l'écran d'accueil » ouvre l'app en plein écran. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Magasin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Gestion magasin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B1017; }
  </style>
</head>
<body>
  <!-- Scanner caméra (Safari) : bibliothèque hébergée ici. L'id est celui que
       mobile_scanner cherche avant de charger sa copie depuis un CDN. -->
  <script id="mobile-scanner-zxing-wasm" src="zxing/reader.js" defer></script>
  <script src="zxing/setup.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
