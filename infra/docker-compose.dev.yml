# ─────────────────────────────────────────────────────────
# Développement local (machine de chaque dev)
#
# UNIQUEMENT PostgreSQL : le backend NestJS et l'app Flutter tournent en direct
# (npm run start:dev / flutter run) pour un rechargement rapide.
#
# Ni MinIO ni Redis :
#  - les fichiers joints (photos) vivent sur le DISQUE du serveur depuis le
#    2026-09-24 (voir backend/src/storage/storage.service.ts) — les images MinIO
#    ont cessé d'être publiquement téléchargeables, ce qui rendait le projet
#    impossible à installer de zéro ;
#  - Redis n'est utilisé par aucune ligne de code : il ne servait à rien.
# ─────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: gestion_magasin_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

volumes:
  postgres_dev_data:
