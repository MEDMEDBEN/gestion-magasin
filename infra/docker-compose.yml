# ─────────────────────────────────────────────────────────────────────────────
# GESTION MAGASIN — production, branchée sur le SOCLE COMMUN du VPS
# (/opt/proxy : un Traefik + un Nginx pour tous les sites, voir proxy/README.md).
#
#   https://${API_DOMAIN}/api/…  → Traefik → Nginx commun → backend (ce projet)
#   https://${API_DOMAIN}/…      → Traefik → Nginx commun → fichiers web publiés
#                                   par le service « web » dans ${SITES_DIR}
#
# Prérequis : le socle tourne (réseau « proxy » créé par /opt/proxy/install.sh).
# Lancer : docker compose up -d --build --remove-orphans
# ─────────────────────────────────────────────────────────────────────────────

# Nom du projet FIGÉ : les données vivent dans les volumes « infra_postgres_data »
# et « infra_backend_storage ». Ne jamais le changer (sinon base neuve et vide).
name: infra

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # TOUJOURS deux proxys devant le backend dans ce mode (Traefik puis
      # Nginx) : fixé ici, il l'emporte sur une ancienne valeur du .env (1).
      TRUST_PROXY_HOPS: "2"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_storage:/app/var/storage
    networks:
      default: {}
      proxy:
        # Nom que le Nginx commun utilise (proxy/nginx/conf.d/<domaine>.conf).
        aliases: [magasin-backend]

  # Version WEB : compilée au build, puis COPIÉE dans le dossier du site servi
  # par le Nginx commun — le conteneur s'arrête ensuite (aucun serveur ici).
  # Les fichiers sont recopiés par-dessus à chaque build (Flutter garde les
  # mêmes noms de fichiers).
  web:
    build:
      context: ../app
      dockerfile: Dockerfile.web
      args:
        API_BASE_URL: https://${API_DOMAIN:?API_DOMAIN manquant dans .env}/api
    restart: "no"
    entrypoint: ["sh", "-c", "cp -a /usr/share/nginx/html/. /dest/ && echo 'Version web publiée.'"]
    volumes:
      - "${SITES_DIR:-/opt/proxy/sites}/${API_DOMAIN}:/dest"
    network_mode: none

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Jamais sur le réseau « proxy » : la base reste interne au projet.

networks:
  proxy:
    name: proxy
    external: true

volumes:
  postgres_data:
  backend_storage:
