# ─────────────────────────────────────────────────────────
# Production — à lancer sur le VPS uniquement
# Traefik gère le HTTPS automatique (Let's Encrypt) et route
# le trafic : /api vers le backend, le reste vers la version web.
# ─────────────────────────────────────────────────────────

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik/letsencrypt:/letsencrypt"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # Les fichiers joints vivent sur un VOLUME du serveur (STORAGE_DIR) : plus
    # de service de stockage à provisionner ni à sauvegarder séparément.
    volumes:
      - backend_storage:/app/var/storage
    labels:
      - "traefik.enable=true"
      # Seul /api va au backend ; le reste du domaine sert la version web.
      - "traefik.http.routers.backend.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=le"
      # HSTS : le navigateur n'essaie plus jamais le http (page de connexion web).
      - "traefik.http.middlewares.hsts.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.routers.backend.middlewares=hsts"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

  # Version WEB de l'app (iPhone, navigateur) sur le même domaine que l'API :
  # https://${API_DOMAIN}/ — compilée au `docker compose build`.
  web:
    build:
      context: ../app
      dockerfile: Dockerfile.web
      args:
        API_BASE_URL: https://${API_DOMAIN:?API_DOMAIN manquant dans .env}/api
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=le"
      - "traefik.http.routers.web.middlewares=hsts"
      - "traefik.http.services.web.loadbalancer.server.port=80"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Pas de port exposé publiquement — accessible seulement depuis le réseau Docker interne

volumes:
  postgres_data:
  backend_storage:
