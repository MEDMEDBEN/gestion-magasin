# Application web d'une seule page (Flutter, React, Vue…) : les fichiers
# existants sont servis, toute autre adresse renvoie index.html.
location ~ \.(js|wasm|json|png|jpg|jpeg|svg|ico|ttf|otf|woff2?|bin|frag|pfb)$ {
    try_files $uri =404;
}
location ~ \.mjs$ {
    types { text/javascript mjs; }
    try_files $uri =404;
}
location / {
    try_files $uri $uri/ /index.html;
}
