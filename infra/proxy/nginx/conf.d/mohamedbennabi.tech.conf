# PORTFOLIO — https://mohamedbennabi.tech (www → redirigé vers la racine)
#   fichiers   → /srv/sites/mohamedbennabi.tech (publiés par le service « web »
#                du dépôt Medben_portfolio : docker compose up -d --build)
#   /api/simulations et /api/health → API de simulation (alias « portfolio-api »)

# Au plus 4 calculs de simulation EN MÊME TEMPS, tous visiteurs confondus
# (l'API limite déjà par client, mais derrière le proxy tous partagent une IP).
limit_conn_zone $server_name zone=portfolio_api:1m;

server {
    listen 80;
    server_name www.mohamedbennabi.tech;
    return 301 https://mohamedbennabi.tech$request_uri;
}

server {
    listen 80;
    server_name mohamedbennabi.tech;
    root /srv/sites/mohamedbennabi.tech;
    index index.html;

    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;

    # Mêmes en-têtes que le nginx du dépôt portfolio (nginx.conf).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # API de simulation : l'URI arrive AVEC son préfixe ; l'API n'accepte que
    # quelques valeurs d'hôte (dont « localhost ») et ne lit aucun en-tête
    # transféré — on n'en envoie donc pas.
    location /api/simulations {
        limit_conn portfolio_api 4;
        set $simulation http://portfolio-api:8000;
        proxy_pass $simulation;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 60s;
    }
    location = /api/health {
        set $simulation http://portfolio-api:8000;
        proxy_pass $simulation;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Real-IP "";
    }

    # Cache : fichiers à empreinte un an, médias un jour, index.html jamais.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* ^/(photo-cut\.webp|favicon\.svg|robots\.txt|404\.html|projects/|experience/|tech/) {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
