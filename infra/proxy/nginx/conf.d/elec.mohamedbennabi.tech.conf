# GESTION MAGASIN (Shino Lighting) — https://elec.mohamedbennabi.tech
#   /api/…  → backend NestJS du projet gestion-magasin (alias « magasin-backend »)
#   le reste → version web Flutter, publiée dans /srv/sites/elec.mohamedbennabi.tech
#             par le service « web » du projet (docker compose up --build).
server {
    listen 80;
    server_name elec.mohamedbennabi.tech;
    root /srv/sites/elec.mohamedbennabi.tech;

    # Mêmes en-têtes que l'ancien nginx dédié (app/web.nginx.conf).
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self' blob: https://fonts.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location /api/ {
        set $backend http://magasin-backend:3000;
        proxy_pass $backend;
        include /etc/nginx/snippets/proxy.conf;
    }

    include /etc/nginx/snippets/spa.conf;
}
