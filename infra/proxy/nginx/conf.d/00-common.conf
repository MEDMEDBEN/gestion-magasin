# Réglages communs à TOUS les sites (contexte http).

# DNS interne de Docker : un backend arrêté n'empêche pas Nginx de démarrer,
# et son adresse est relue s'il redémarre.
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;
# Photos, imports Excel, factures scannées : 10 Mo au plus par envoi.
client_max_body_size 10m;

gzip on;
gzip_types application/javascript text/javascript application/wasm application/json text/css image/svg+xml;

# WebSocket (temps réel) : « Connection: upgrade » seulement si demandé.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Domaine inconnu (ou accès par l'IP) : connexion fermée, rien ne fuit.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
